# ╔══════════════════════════════════════════════════════════════╗
# ║              kitty.conf — theme, font, layout, keybinds      ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Shell ─────────────────────────────────────────────────────
shell             /usr/bin/fish
# no-cursor: conf.d/animations.fish owns the cursor shape; kitty's
# integration would otherwise reset it on every prompt/command
shell_integration no-cursor

# ── Font ──────────────────────────────────────────────────────
# pacman -S ttf-jetbrains-mono-nerd
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        13.5

# ── Cursor (animated beam + trail) ───────────────────────────
cursor_shape              beam
cursor_shape_unfocused    hollow
cursor_beam_thickness     1.5
cursor_blink_interval     0.5
cursor_stop_blinking_after 0
cursor_trail              3
cursor_trail_decay        0.1 0.4

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait    3.0
copy_on_select     yes
focus_follows_mouse no

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Performance ───────────────────────────────────────────────
repaint_delay   13
input_delay     3
sync_to_monitor yes

# ── Window Layout ─────────────────────────────────────────────
enabled_layouts        splits,tall,stack,*
remember_window_size   no
initial_window_width   1050
initial_window_height  680
window_padding_width   14
window_margin_width    6
window_border_width    2pt
draw_minimal_borders   yes
placement_strategy     center
hide_window_decorations titlebar-only
inactive_text_alpha    0.45

# Frosted glass / transparency
background_opacity         0.92
background_blur            28
dynamic_background_opacity yes

# ── Tab Bar (powerline style) ─────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_align             left
tab_bar_min_tabs          1
tab_bar_margin_width      8
tab_bar_margin_height     6 6
tab_title_template        "{bell_symbol}{sup.index} {title}"
active_tab_title_template "{bell_symbol}{sup.index} {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_switch_strategy       previous
tab_activity_symbol       none

# ── Bells ─────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.1
window_alert_on_bell yes

# ── URL Handling ──────────────────────────────────────────────
url_style      dotted
open_url_with  default
detect_urls    yes

# ── Word Selection ────────────────────────────────────────────
select_by_word_characters *?_-.[]~&;!#$%^(){}<>

# ══════════════════════════════════════════════════════════════
#  Color theme — written by `theme-pick` (kitten themes edits
#  themes.conf, never this file)
# ══════════════════════════════════════════════════════════════
include themes.conf

# ── Keyboard Shortcuts ────────────────────────────────────────
# kitty_mod = ctrl+shift. kitty's defaults cover the rest:
# copy/paste (c/v), new OS window (n), close pane (w), close tab (q),
# prev/next tab (left/right), font size (equal/minus/backspace),
# resize pane (r), fullscreen (f11), reload config (f5),
# opacity (a>m / a>l). See `kitty +kitten show_key` / kitty docs.

# ── Tabs ──────────────────────────────────────────────────────
map kitty_mod+t     new_tab_with_cwd
map alt+1           goto_tab 1
map alt+2           goto_tab 2
map alt+3           goto_tab 3
map alt+4           goto_tab 4
map alt+5           goto_tab 5
map alt+6           goto_tab 6
map alt+7           goto_tab 7
map alt+8           goto_tab 8
map alt+9           goto_tab 9

# ── Pane splits ───────────────────────────────────────────────
map kitty_mod+d     launch --location=vsplit --cwd=current
map kitty_mod+alt+d launch --location=hsplit --cwd=current

# ── Pane navigation ───────────────────────────────────────────
map kitty_mod+alt+left  neighboring_window left
map kitty_mod+alt+right neighboring_window right
map kitty_mod+alt+up    neighboring_window up
map kitty_mod+alt+down  neighboring_window down

# ── Layout toggle (zoom current pane) ─────────────────────────
map kitty_mod+alt+z toggle_layout stack

# ── Clear screen + scrollback ─────────────────────────────────
map kitty_mod+alt+k clear_terminal scroll active

# ── Jump by word ──────────────────────────────────────────────
map alt+left        send_text all \x1b\x62
map alt+right       send_text all \x1b\x66
