# ╔══════════════════════════════════════════════════════════════╗
# ║        kitty.conf — Modern Mac / Mono-Green (Terminal)       ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Shell ─────────────────────────────────────────────────────
# shell is set per-OS in os.conf (see below)
shell_integration enabled

# ── Font ──────────────────────────────────────────────────────
# Install with: brew install --cask font-jetbrains-mono-nerd-font
font_family      JetBrainsMono Nerd Font Mono
bold_font        JetBrainsMono Nerd Font Mono Bold
italic_font      JetBrainsMono Nerd Font Mono Italic
bold_italic_font JetBrainsMono Nerd Font Mono Bold Italic
font_size        13.5

# Fallback (if Nerd Font not installed yet)
# font_family      Menlo
# font_size        13.0

# Font rendering tweaks for macOS Retina
text_composition_strategy platform
macos_thicken_font 0.75

# ── Cursor (animated beam + trail) ───────────────────────────
cursor_shape              beam
cursor_shape_unfocused    hollow
cursor_beam_thickness     1.5
cursor_blink_interval     0.5
cursor_stop_blinking_after 0
cursor_trail              3
cursor_trail_decay        0.1 0.4

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait    3.0
copy_on_select     yes
focus_follows_mouse no

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000

# ── Performance ───────────────────────────────────────────────
repaint_delay   13
input_delay     3
sync_to_monitor yes

# ── Window Layout ─────────────────────────────────────────────
enabled_layouts        splits,tall,stack,*
remember_window_size   no
initial_window_width   1050
initial_window_height  680
window_padding_width   14
window_margin_width    6
single_window_padding_width 0
window_border_width    2pt
draw_minimal_borders   yes
placement_strategy     center
hide_window_decorations titlebar-only
inactive_text_alpha    0.45

# Frosted glass / transparency
background_opacity         0.92
background_blur            28
dynamic_background_opacity yes

# ── Tab Bar (powerline style) ─────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       round
tab_bar_align             left
tab_bar_min_tabs          1
tab_title_template        "{bell_symbol}{sup.index} {title}"
active_tab_title_template "{bell_symbol}{sup.index} {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_switch_strategy       previous
tab_activity_symbol       "⚡ "

# ── macOS Specifics ───────────────────────────────────────────
macos_option_as_alt              yes
macos_quit_when_last_window_closed yes
macos_window_resizable           yes
macos_traditional_fullscreen     no
macos_show_window_title_in       none
macos_titlebar_color             background

# Bells ─────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    #33FF66
window_alert_on_bell yes

# ── URL Handling ──────────────────────────────────────────────
url_color      #33FF66
url_style      dotted
open_url_with  default
open_url_modifiers cmd
detect_urls    yes

# ── Word Selection ────────────────────────────────────────────
select_by_word_characters *?_-.[]~&;!#$%^(){}<>

# ══════════════════════════════════════════════════════════════
#  Mono-Green — monochrome grayscale base, green accents only
#  (phosphor-terminal inspired: everything is gray/black/white,
#   with green reserved for cursor/success/highlights)
# ══════════════════════════════════════════════════════════════

foreground           #D4D4D4
background           #0B0E0C
selection_foreground #0B0E0C
selection_background #33FF66

# Cursor
cursor           #33FF66
cursor_text_color #0B0E0C

# Window borders
active_border_color   #33FF66
inactive_border_color #4A4A4A
bell_border_color     #33FF66

# Tab bar
active_tab_foreground   #0B0E0C
active_tab_background   #33FF66
inactive_tab_foreground #A0A0A0
inactive_tab_background #161918
tab_bar_background      #0B0E0C
tab_bar_margin_color    #0B0E0C

# Marks
mark1_foreground #0B0E0C
mark1_background #33FF66
mark2_foreground #0B0E0C
mark2_background #17C93C
mark3_foreground #0B0E0C
mark3_background #9EF5B3

# ── 16-Color Palette — monochrome grays, green accents ─────────

# Black / Surface
color0  #1A1D1B
color8  #4A4A4A

# Red / Error (kept desaturated so alerts still read but stay grayscale-forward)
color1  #8A8A8A
color9  #C7C7C7

# Green / Success — the ONE accent color
color2  #17C93C
color10 #33FF66

# Yellow / Warning
color3  #8A8A8A
color11 #C7C7C7

# Blue / Info
color4  #7A7A7A
color12 #B5B5B5

# Magenta / Pink
color5  #7A7A7A
color13 #B5B5B5

# Cyan / Teal
color6  #17C93C
color14 #33FF66

# White / Text
color7  #D4D4D4
color15 #F2F2F2

# ── Keyboard Shortcuts ────────────────────────────────────────

# ── Clipboard ─────────────────────────────────────────────────
map cmd+c       copy_to_clipboard
map cmd+v       paste_from_clipboard

# ── Natural Mac text editing ──────────────────────────────────
# Jump to start / end of line
map cmd+left        send_text all \x01
map cmd+right       send_text all \x05
# Jump by word
map alt+left        send_text all \x1b\x62
map alt+right       send_text all \x1b\x66
# Delete to start of line
map cmd+backspace   send_text all \x15
# Undo
map cmd+z           send_text all \x1f

# ── OS windows ────────────────────────────────────────────────
map cmd+n           new_os_window
map cmd+shift+w     close_os_window

# ── Pane splits ───────────────────────────────────────────────
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+shift+equal close_window

# ── Pane navigation (ctrl+cmd+arrows) ─────────────────────────
map ctrl+cmd+left   neighboring_window left
map ctrl+cmd+right  neighboring_window right
map ctrl+cmd+up     neighboring_window up
map ctrl+cmd+down   neighboring_window down

# ── Pane resize ───────────────────────────────────────────────
map ctrl+cmd+shift+left  resize_window wider
map ctrl+cmd+shift+right resize_window narrower
map ctrl+cmd+shift+up    resize_window taller
map ctrl+cmd+shift+down  resize_window shorter 3
map ctrl+cmd+0           resize_window reset

# ── Tabs ──────────────────────────────────────────────────────
map cmd+t           new_tab_with_cwd
map cmd+w           close_tab
map cmd+]           next_tab
map cmd+[           previous_tab
map cmd+1           goto_tab 1
map cmd+2           goto_tab 2
map cmd+3           goto_tab 3
map cmd+4           goto_tab 4
map cmd+5           goto_tab 5
map cmd+6           goto_tab 6
map cmd+7           goto_tab 7
map cmd+8           goto_tab 8
map cmd+9           goto_tab 9

# ── Layout toggle ─────────────────────────────────────────────
map cmd+shift+z     toggle_layout stack

# ── Font size ─────────────────────────────────────────────────
map cmd+equal       change_font_size all +1.0
map cmd+minus       change_font_size all -1.0
map cmd+0           restore_font_size

# ── Scroll / clear ────────────────────────────────────────────
map cmd+k           clear_terminal scroll active

# ── Toggle transparency ───────────────────────────────────────
map cmd+shift+a     set_background_opacity +0.1
map cmd+shift+s     set_background_opacity -0.1

# ── Fullscreen ────────────────────────────────────────────────
map cmd+shift+f     toggle_fullscreen

# ── Reload config ─────────────────────────────────────────────
map ctrl+cmd+,      load_config_file

# ── Per-OS overrides ──────────────────────────────────────────
# install.sh copies os-linux.conf or os-macos.conf to os.conf
include os.conf
