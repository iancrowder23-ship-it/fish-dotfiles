# Linux/Arch-specific overrides (install.sh copies this to ~/.config/kitty/os.conf)
shell /usr/bin/fish

# Note: all macos_* options and Mac font tweaks in kitty.conf are
# silently ignored on Linux. "cmd" in keybindings maps to the Super key.
# If you'd rather have ctrl+shift defaults for copy/paste too:
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
