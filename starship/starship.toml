"$schema" = 'https://starship.rs/config-schema.json'
# ══════════════════════════════════════════════════════════════
#  starship.toml — Material-style pill prompt
#  Each segment is its own rounded pill, and pills with nothing
#  to show disappear. Colors come from [palettes.dotfiles] at the
#  bottom. theme-pick (and a new shell after any kitty theme
#  change) rewrites those values from the active kitty theme —
#  edit the layout freely.
# ══════════════════════════════════════════════════════════════

palette = "dotfiles"
add_newline = true

format = """
[](fg:chip)$os$username$hostname$sudo[](fg:chip) \
[](fg:surface)$directory[](fg:surface) \
([](fg:surface)$git_branch$git_commit$git_state$git_status$git_metrics[](fg:surface) )\
([](fg:surface2)\
$c$cpp$rust$golang$zig$nodejs$bun$deno$python$conda$java$kotlin$lua$ruby$php$dotnet$package$nix_shell$docker_context\
[](fg:surface2))\
$fill\
$cmd_duration\
$jobs\
$battery\
$status\
([](fg:surface)$time[](fg:surface))\
$line_break\
$character"""

# ── Identity pill (tonal accent) ───────────────────────────────
[os]
disabled = false
style = "bg:chip fg:accent_bright"
format = "[$symbol ]($style)"

[os.symbols]
Arch = "󰣇"
EndeavourOS = ""
Manjaro = ""
CachyOS = "󰣇"
Linux = ""

[username]
show_always = true
style_user = "bg:chip fg:accent_bright bold"
style_root = "bg:chip fg:red bold"
format = "[$user]($style)"

[hostname]
ssh_only = true
ssh_symbol = "󰒋 "
style = "bg:chip fg:accent_bright"
format = "[ 󰁥 $ssh_symbol$hostname]($style)"

[sudo]
disabled = false
symbol = " 󰌋"
style = "bg:chip fg:yellow"
format = "[$symbol]($style)"

# ── Directory pill ─────────────────────────────────────────────
[directory]
style = "bg:surface fg:accent_bright"
read_only_style = "bg:surface fg:red"
format = "[$path]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
home_symbol = "󰋜"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Videos" = "󰕧"
"Desktop" = "󰇄"
"Coding" = "󰲋"
"Projects" = "󰲋"
".config" = ""

# ── Git pill ───────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "bg:surface fg:accent"
format = "[$symbol $branch]($style)"

[git_commit]
tag_disabled = false
tag_symbol = " 󰓹 "
style = "bg:surface fg:accent"
format = "[ 󰜘 $hash$tag]($style)"

[git_state]
style = "bg:surface fg:yellow"
format = "[ 󰘬 $state( $progress_current/$progress_total)]($style)"

[git_status]
style = "bg:surface fg:accent_bright"
format = "([$all_status$ahead_behind]($style))"
conflicted = " 󰞇"
ahead = " 󰁝$count"
behind = " 󰁅$count"
diverged = " 󰹹 󰁝$ahead_count󰁅$behind_count"
up_to_date = " 󰅠"
untracked = " 󰋗 $count"
stashed = " 󰏗 $count"
modified = " 󰏫 $count"
staged = " 󰐕 $count"
renamed = " 󰑕 $count"
deleted = " 󰆴 $count"

[git_metrics]
disabled = false
added_style = "bg:surface fg:green"
deleted_style = "bg:surface fg:red"
format = "([ +$added]($added_style))([ -$deleted]($deleted_style))"

# ── Toolchain pill ─────────────────────────────────────────────
[c]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[cpp]
disabled = false
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[rust]
symbol = "󱘗"
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[golang]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[zig]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[nodejs]
symbol = "󰎙"
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[bun]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[deno]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[python]
symbol = "󰌠"
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version)( \\($virtualenv\\)) ]($style)"

[conda]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol $environment ]($style)"

[java]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[kotlin]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[lua]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[ruby]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[php]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[dotnet]
symbol = "󰪮"
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol( $version) ]($style)"

[package]
symbol = "󰏗"
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol $version ]($style)"

[nix_shell]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol $state ]($style)"

[docker_context]
symbol = ""
style = "bg:surface2 fg:accent_bright"
format = "[ $symbol $context ]($style)"

# ── Right side ─────────────────────────────────────────────────
[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style = "fg:bright-black"
format = "[󱦟 $duration ]($style)"

[jobs]
symbol = "󰜎 "
style = "fg:accent"
format = "[$symbol$number ]($style)"

[battery]
format = "[$symbol$percentage ]($style)"
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "

[[battery.display]]
threshold = 20
style = "fg:red"

[status]
disabled = false
symbol = "󰅙 "
not_executable_symbol = "󰂭 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰟾 "
signal_symbol = "󱐋 "
style = "fg:red"
format = "[$symbol$status ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface fg:accent"
format = "[󰥔 $time]($style)"

[character]
success_symbol = "[󰅂](bold fg:accent)"
error_symbol = "[󰅂](bold fg:red)"
vimcmd_symbol = "[󰅁](bold fg:accent)"

# Overwritten with hex values read from the kitty theme:
# accent = theme color for $dotfiles_accent, chip = accent blended
# into the background (tonal container), surfaces = background
# blended toward foreground. The names below are only first-run defaults.
[palettes.dotfiles]
accent = "green"
accent_bright = "bright-green"
chip = "black"
surface = "black"
surface2 = "bright-black"
